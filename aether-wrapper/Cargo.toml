[package]
name = "aether-jni"
version = "0.1.0"
edition = "2021"
description = "Manjaniq JNI wrapper for Aether v2.4.0"
license = "AGPL-3.0-only"

[lib]
name = "aether"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# Path-pinned to vendored third_party/Aether (v2.4.0 peeled d58f9d5). Avoids git fetch
# and allows rust-version patch on quiche for CI stable.
#
# The `tor` FEATURE IS ON:
#
#   aether = { path = "../third_party/Aether/aether", features = ["tor"] }
#
# It pulls arti-client (with its pt-client, static-sqlite and liblzma
# dependencies), tor-chanmgr, tor-rtcompat, tokio-util and tracing-subscriber
# into libaether.so, so `tor.rs` compiles `with_tor` instead of the
# `unsupported()` stubs (`tor.rs:210-228`). Without it every --tor /
# --tor-reverse / --psiphon-reverse route aborts with
# "this build has no tor support; rebuild with cargo build --release --features
# tor". The app's argument list (`AetherCoreManager.buildArguments`) passes
# `--tor`, `--tor-reverse`, `--psiphon` and `--psiphon-reverse` straight through
# to `aether_core_start`, so enabling this feature is what the build lacked.
#
# The companion crates make libaether.so grow; that is the size of Tor support
# and is accepted. The release profile below still strips symbols and uses thin
# LTO, and `cargo ndk` in CI builds every target with the features declared
# here (no extra `--features` flag needed).
#
# Build requirements for these extra crates, all met by the CI job
# (.github/workflows/build-debug.yml): an NDK clang for the C code
# (rusqlite's `static-sqlite` and `liblzma`'s `static` both compile C sources;
# cargo-ndk exports CC for the target), and cmake/perl/pkg-config, which the
# job installs before the Rust build.
aether = { path = "../third_party/Aether/aether", features = ["tor"] }
# Match the vendored Aether Cargo.lock. The wrapper is its own workspace root,
# so the path dependency's lock is not honored here; floating "5.3" recently
# resolved boring-sys 5.5.0, whose Android x86_64 bindgen output fails with
# `unresolved import _bindgen_ty_1`. Pin the known-good BoringSSL bindings.
boring = "=5.3.0"
boring-sys = "=5.3.0"
jni = "0.21.1"
serde_json = "1"
# The bridge installs its own `log` sink (logcat + an in-memory ring the app
# reads back), so the engine's own messages reach the device log and the app's
# log panel instead of a stderr nobody owns. Same version the core resolves.
log = "0.4"

# Build requirements documented in aether/README.md:
# CMake, C++ compiler, Perl required for BoringSSL (NDK provides clang)

# Profile settings only take effect from the workspace root, i.e. from here:
# `third_party/Aether/aether/Cargo.toml` is a path *dependency* of this crate,
# so the `[profile.release]` block it carries (lto = "fat", strip = true, …) has
# never applied to this build. Cargo only reads the profiles of the workspace
# root, which is why libaether.so has so far shipped unstripped and without
# link-time optimisation.
#
# `strip = "symbols"` removes the symbol tables that were the bulk of the file;
# `lto = "thin"` lets the cross-crate inlining happen (thin rather than fat keeps
# the CI build within its time budget) and drops the dead code the JNI surface
# never reaches. Neither changes behaviour: the JNI exports are `#[no_mangle]`
# and therefore stay in the dynamic symbol table.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "unwind"
strip = "symbols"
